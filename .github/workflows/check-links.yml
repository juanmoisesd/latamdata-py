name: Check for broken links
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-retries 3
            --timeout 20
            --accept 200,204,206,301,302,403,429
            --exclude-path .git
            --exclude "^https://doi\.org/"
            --exclude "^https://dx\.doi\.org/"
            --exclude "^https://zenodo\.org/"
            --exclude "^https://twitter\.com/"
            --exclude "^https://x\.com/"
            --exclude "^https://linkedin\.com/"
            --exclude "^https://www\.linkedin\.com/"
            --exclude "^https://t\.co/"
            --exclude "^https://pypi\.org/"
            --exclude "^mailto:"
            --exclude "^#"
            --exclude "CHANGELOG_URL_PLACEHOLDER"
            --exclude "YOUR_"
            --exclude "example\.com"
            '**/*.md'
          fail: true
          jobSummary: true
