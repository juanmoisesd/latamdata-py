# lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Accept these HTTP status codes as valid (includes 403 for auth-required pages)
accept = [200, 204, 206, 301, 302, 307, 308, 403, 429]

# Maximum number of redirects
max_redirects = 5

# Timeout in seconds
timeout = 20

# Maximum retries
max_retries = 3

# Exclude local file paths and known problematic URL patterns
exclude = [
  "^file://",
  "^https://doi.org/",
  "^https://dx.doi.org/",
  "^https://zenodo.org/",
  "^https://github.com/.*/issues/new",
  "^https://github.com/.*/compare/",
  "^https://github.com/.*/releases/tag/",
  "^https://twitter.com/",
  "^https://x.com/",
  "^https://linkedin.com/",
  "^https://www.linkedin.com/",
  "^https://t.co/",
  "^https://badge.fury.io/",
  "^https://img.shields.io/",
  "^mailto:",
  "^#",
  "example.com",
  "YOUR_",
  "PLACEHOLDER",
]

# Exclude local file paths from checking
exclude_path = [".git", "node_modules", "venv", "__pycache__"]

# Skip checking local file links (only check http/https)
scheme = ["https", "http"]
